
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue a Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 25px;
        }
        .container {
            max-width: 700px;
            margin: auto;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        h1, h2 {
            color: #17365d;
        }
        select, button {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
        }
        button {
            background: #17365d;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Issue a Book</h1>

    <p>
        <a href="/">Home</a> |
        <a href="/members">Manage Members</a> |
        <a href="/loans">View Loans</a>
    </p>

    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <div class="card">
        {% if books and members %}
        <form method="POST">
            <label>Select Book:</label>
            <select name="book_id" required>
                {% for book in books %}
                <option value="{{ book.id }}">
                    {{ book.title }} — {{ book.author }}
                </option>
                {% endfor %}
            </select>

            <label>Select Member:</label>
            <select name="member_id" required>
                {% for member in members %}
                <option value="{{ member.id }}">
                    {{ member.name }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">Issue Book</button>
        </form>
        {% else %}
            <p>Please add at least one available book and one member first.</p>
        {% endif %}
    </div>
</div>
</body>
</html>
